services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\CardBundle\:
        resource: '../src/'
        exclude: '../src/{Entity,Enum,Message,Export/ChromeSession.php,Export/ExportState.php,Export/PdfItem.php,Export/SocialItem.php,Payment/SkinItem.php}'

    # The backs' stylesheet and controller, drawn on public pages (see templates/components/Back.html.twig)
    c975L\CardBundle\Service\AssetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 100 }
            - { name: 'ui.script', priority: 100 }

    # UiBundle's favorites limiter, optional: a site that does not declare it calls unlimited. Wired here because the "@?" of an optional reference only exists in this format, #[Autowire] reading it as a service id
    c975L\CardBundle\Service\CardRequest:
        arguments:
            $limiterFactory: '@?limiter.ui_favorite'
