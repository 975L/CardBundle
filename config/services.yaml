services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\CardBundle\:
        resource: '../src/'
        exclude: '../src/{Entity,Enum,Message,Export/ChromeSession.php,Export/ExportState.php,Export/PdfItem.php,Export/SocialItem.php}'

    # UiBundle's favorites limiter, optional: a site that does not declare it calls unlimited. Wired here because the "@?" of an optional reference only exists in this format, #[Autowire] reading it as a service id
    c975L\CardBundle\Service\CardRequest:
        arguments:
            $limiterFactory: '@?limiter.ui_favorite'
